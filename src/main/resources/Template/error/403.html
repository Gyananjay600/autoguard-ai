<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>403 – Access Denied | AutoGuard AI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css?v=6}"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
<div class="card shadow-sm text-center p-4 p-md-5" style="max-width: 480px; border-radius: 20px;">
    <div class="mb-3 text-danger" style="font-size: 4rem;">
        <i class="bi bi-shield-x"></i>
    </div>
    <h1 class="display-3 fw-extrabold text-dark mb-0">403</h1>
    <h4 class="fw-bold text-muted mb-3">Access Denied</h4>
    <p class="text-muted small mb-4">
        You do not have permission to view this resource. Contact your administrator if you require higher access privileges.
    </p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a href="/dashboard" class="btn btn-dark">
            <i class="bi bi-speedometer2 me-1.5"></i>Go to Dashboard
        </a>
        <form th:action="@{/auth/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger">
                <i class="bi bi-box-arrow-right me-1.5"></i>Logout
            </button>
        </form>
    </div>
</div>
</body>
</html>
