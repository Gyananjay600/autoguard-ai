<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Upload Sensor – Auto Guard AI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css?v=2}"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">
            <i class="bi bi-shield-check"></i> Auto Guard AI
        </a>
        <div class="navbar-nav ms-auto gap-1">
            <a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
            <a class="nav-link" href="/vehicles"><i class="bi bi-truck me-1"></i>Vehicles</a>
            <a class="nav-link" href="/sensors/upload"><i class="bi bi-activity me-1"></i>Add Sensor</a>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <button type="submit" class="nav-link btn btn-link p-0 border-0">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-1"><i class="bi bi-activity me-1"></i>Add Sensor Reading</h5>
            <p class="text-muted small mb-4">Log real-time measurements to run AI fault prediction.</p>
            <form th:action="@{/sensors/save}"
                  th:object="${sensorDTO}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Vehicle</label>
                        <select th:field="*{vehicleId}" class="form-select" required>
                            <option value="">-- Select Vehicle --</option>
                            <option th:each="v : ${vehicles}"
                                    th:value="${v.id}"
                                    th:text="${v.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">RPM</label>
                        <input type="number" step="0.1"
                               th:field="*{rpm}" class="form-control"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Engine Temp (°C)</label>
                        <input type="number" step="0.1"
                               th:field="*{engineTemp}" class="form-control"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Oil Pressure</label>
                        <input type="number" step="0.1"
                               th:field="*{oilPressure}" class="form-control"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Vibration</label>
                        <input type="number" step="0.1"
                               th:field="*{vibration}" class="form-control"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Error Code</label>
                        <input type="text" th:field="*{errorCode}"
                               class="form-control" placeholder="e.g. P0128"/>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-dark">Save Reading</button>
                    <a href="/dashboard" class="btn btn-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
