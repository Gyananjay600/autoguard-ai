<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Upload Sensor – AutoGuard AI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css?v=6}"/>
</head>
<body class="bg-light app-shell">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-activity me-2 text-primary"></i>Add Manual Sensor Telemetry
                    </h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small mb-4">Log real-time vehicle measurements to evaluate AI fault prediction algorithms.</p>
                    
                    <form th:action="@{/sensors/save}" th:object="${sensorDTO}" method="post">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Target Vehicle</label>
                                <select th:field="*{vehicleId}" class="form-select" required>
                                    <option value="">-- Select Vehicle from Fleet --</option>
                                    <option th:each="v : ${vehicles}"
                                            th:value="${v.id}"
                                            th:text="${v.name} + ' (' + ${v.make} + ' ' + ${v.model} + ')'"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Engine RPM</label>
                                <input type="number" step="0.1" th:field="*{rpm}" class="form-control" placeholder="e.g. 2800"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Engine Temperature (°C)</label>
                                <input type="number" step="0.1" th:field="*{engineTemp}" class="form-control" placeholder="e.g. 92.5"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Oil Pressure (PSI)</label>
                                <input type="number" step="0.1" th:field="*{oilPressure}" class="form-control" placeholder="e.g. 42.0"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Vibration Level</label>
                                <input type="number" step="0.1" th:field="*{vibration}" class="form-control" placeholder="e.g. 0.4"/>
                            </div>
                            <div class="col-12">
                                <label class="form-label">DTC Diagnostic Error Code (Optional)</label>
                                <input type="text" th:field="*{errorCode}" class="form-control" placeholder="e.g. P0128, P0300, P0420"/>
                                <div class="form-text">Leave blank if no warning indicators or error codes are active.</div>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-dark">
                                <i class="bi bi-save me-1.5"></i>Save Telemetry Reading
                            </button>
                            <a href="/dashboard" class="btn btn-outline-dark">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
