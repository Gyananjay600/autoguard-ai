<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Register – Auto Guard AI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css?v=2}"/>
</head>
<body class="bg-light auth-page">
<div class="container auth-container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm auth-card">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-2"><i class="bi bi-person-plus"></i> Create Account</h4>
                    <p class="text-center text-muted small mb-4">Set up your Auto Guard AI account</p>

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         th:text="${errorMessage}"></div>

                    <form th:action="@{/auth/register}"
                          th:object="${registerDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{name}"
                                   class="form-control" required/>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}"
                                   class="form-control" required/>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}"
                                   class="form-control" required/>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>
                        <button type="submit"
                                class="btn btn-dark w-100">Register</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/auth/login}">
                            Already have an account? Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
