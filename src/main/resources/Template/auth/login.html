<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login – Auto Guard AI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css?v=2}"/>
</head>
<body class="bg-light auth-page">
<div class="container auth-container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm auth-card">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">
                        <i class="bi bi-shield-check"></i> Auto Guard AI
                    </h4>
                    <p class="text-center text-muted small mb-4">Sign in to continue monitoring your vehicles</p>

                    <div th:if="${param.error}"
                         class="alert alert-danger">
                        Invalid email or password.
                    </div>
                    <div th:if="${param.logout}"
                         class="alert alert-info">
                        You have been logged out.
                    </div>
                    <div th:if="${param.registered}"
                         class="alert alert-success">
                        Registered successfully. Please login.
                    </div>

                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="username"
                                   class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password"
                                   class="form-control" required/>
                        </div>
                        <button type="submit"
                                class="btn btn-dark w-100">Login</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/auth/register}">
                            Don't have an account? Register
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
