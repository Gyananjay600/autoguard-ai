<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin Panel – Auto Guard AI</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css?v=2}"/>
</head>
<body class="bg-light">
<div class="container mt-4">
  <h5 class="mb-4">Admin Panel</h5>

  <!-- Knowledge Base -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between">
      <span>Knowledge Base Articles</span>
      <a href="/admin/knowledge/new" class="btn btn-sm btn-dark">
        + New Article
      </a>
    </div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
        <tr>
          <th>Title</th><th>Category</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${articles}">
          <td th:text="${a.title}"></td>
          <td th:text="${a.category}"></td>
          <td>
            <a th:href="@{/admin/knowledge/{id}/edit(id=${a.id})}"
               class="btn btn-sm btn-outline-secondary">Edit</a>
            <form th:action="@{/admin/knowledge/{id}/delete(id=${a.id})}"
                  method="post"
                  class="d-inline"
                  onsubmit="return confirm('Delete?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- User Management -->
  <div class="card">
    <div class="card-header">User Management</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
        <tr>
          <th>Name</th><th>Email</th><th>Role</th><th>Change Role</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.name}"></td>
          <td th:text="${u.email}"></td>
          <td th:text="${u.role}"></td>
          <td>
            <form th:action="@{/admin/users/{id}/role(id=${u.id})}"
                  method="post" class="d-flex gap-2">
              <select name="role" class="form-select form-select-sm">
                <option value="OWNER">OWNER</option>
                <option value="ENGINEER">ENGINEER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
              <button type="submit"
                      class="btn btn-sm btn-dark">Update</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
