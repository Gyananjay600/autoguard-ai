<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Knowledge Base Article – AutoGuard AI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css?v=6}"/>
</head>
<body class="bg-light app-shell">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-book me-2 text-primary"></i>Knowledge Base Article Editor
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/knowledge/save}" th:object="${article}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Article Title</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Engine Overheating Diagnostics & Flush Procedure" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" th:field="*{category}" class="form-control" placeholder="e.g. Engine, Cooling Systems, Brakes, Transmission"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Article Content (Markdown / Text)</label>
                            <textarea th:field="*{content}" class="form-control" rows="8" placeholder="Enter detailed procedures, diagnostic steps, warning symptoms, and repair guidelines..." required></textarea>
                        </div>
                        
                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-dark">
                                <i class="bi bi-save me-1.5"></i>Save Article
                            </button>
                            <a href="/admin/panel" class="btn btn-outline-dark">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
