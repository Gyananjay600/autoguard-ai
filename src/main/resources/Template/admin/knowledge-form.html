<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Knowledge Article – Auto Guard AI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css?v=2}"/>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title">Knowledge Article</h5>
            <form th:action="@{/admin/knowledge/save}"
                  th:object="${article}" method="post">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" th:field="*{title}"
                           class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" th:field="*{category}"
                           class="form-control"
                           placeholder="e.g. Engine, Cooling, Brakes"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Content</label>
                    <textarea th:field="*{content}" class="form-control"
                              rows="8" required></textarea>
                </div>
                <button type="submit" class="btn btn-dark">Save</button>
                <a href="/admin/panel" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
