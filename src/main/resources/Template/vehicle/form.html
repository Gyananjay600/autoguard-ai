<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Vehicle Form – Auto Guard AI</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css?v=2}"/>
</head>
<body class="bg-light">
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title"
          th:text="${vehicle.id != null} ? 'Edit Vehicle' : 'Add Vehicle'">
      </h5>

      <form th:action="${vehicle.id != null}
                  ? @{/vehicles/{id}/update(id=${vehicle.id})}
                  : @{/vehicles/save}"
            th:object="${vehicle}" method="post">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}"
                   class="form-control" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Make</label>
            <input type="text" th:field="*{make}"
                   class="form-control" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Model</label>
            <input type="text" th:field="*{model}"
                   class="form-control" required/>
          </div>
          <div class="col-md-3">
            <label class="form-label">Year</label>
            <input type="number" th:field="*{year}"
                   class="form-control"/>
          </div>
          <div class="col-md-3">
            <label class="form-label">Mileage</label>
            <input type="number" th:field="*{mileage}"
                   class="form-control"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Engine Type</label>
            <input type="text" th:field="*{engineType}"
                   class="form-control"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">VIN</label>
            <input type="text" th:field="*{vin}"
                   class="form-control"/>
          </div>
        </div>

        <div class="mt-3">
          <button type="submit" class="btn btn-dark">Save</button>
          <a href="/vehicles" class="btn btn-secondary ms-2">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
