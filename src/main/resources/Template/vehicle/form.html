<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vehicle Form – AutoGuard AI</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css?v=6}"/>
</head>
<body class="bg-light app-shell">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header py-3">
          <h5 class="mb-0 fw-bold">
            <i class="bi bi-truck me-2 text-primary"></i>
            <span th:text="${vehicle.id != null} ? 'Edit Vehicle Details' : 'Register New Vehicle'">Register New Vehicle</span>
          </h5>
        </div>
        <div class="card-body p-4">
          <form th:action="${vehicle.id != null}
                      ? @{/vehicles/{id}/update(id=${vehicle.id})}
                      : @{/vehicles/save}"
                th:object="${vehicle}" method="post">

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Vehicle Identifier / Name</label>
                <input type="text" th:field="*{name}"
                       class="form-control" placeholder="e.g. Delivery Van #04" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Make</label>
                <input type="text" th:field="*{make}"
                       class="form-control" placeholder="e.g. Ford, Toyota, Volvo" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Model</label>
                <input type="text" th:field="*{model}"
                       class="form-control" placeholder="e.g. Transit, F-150" required/>
              </div>
              <div class="col-md-3">
                <label class="form-label">Model Year</label>
                <input type="number" th:field="*{year}"
                       class="form-control" placeholder="e.g. 2023"/>
              </div>
              <div class="col-md-3">
                <label class="form-label">Current Mileage (mi)</label>
                <input type="number" th:field="*{mileage}"
                       class="form-control" placeholder="e.g. 45000"/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Engine Type</label>
                <input type="text" th:field="*{engineType}"
                       class="form-control" placeholder="e.g. 3.5L V6 EcoBoost / Electric"/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Vehicle Identification Number (VIN)</label>
                <input type="text" th:field="*{vin}"
                       class="form-control" placeholder="e.g. 1FTFW1E84MK123456"/>
              </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex gap-2">
              <button type="submit" class="btn btn-dark">
                <i class="bi bi-check-lg me-1.5"></i>Save Vehicle
              </button>
              <a href="/vehicles" class="btn btn-outline-dark">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
