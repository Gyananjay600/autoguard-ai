<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Vehicles – Auto Guard AI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css?v=2}"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">
            <i class="bi bi-shield-check"></i> Auto Guard AI
        </a>
        <div class="navbar-nav ms-auto gap-1">
            <a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
            <a class="nav-link" href="/vehicles"><i class="bi bi-truck me-1"></i>Vehicles</a>
            <a class="nav-link" href="/sensors/upload"><i class="bi bi-activity me-1"></i>Add Sensor</a>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <button type="submit" class="nav-link btn btn-link p-0 border-0">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0"><i class="bi bi-truck me-1"></i>All Vehicles</h5>
        <a href="/vehicles/new" class="btn btn-dark btn-sm">
            <i class="bi bi-plus-circle me-1"></i>Add Vehicle
        </a>
    </div>
    <div class="card panel-table">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle bg-white">
                <thead class="table-dark">
                <tr>
                    <th>Name</th><th>Make</th><th>Model</th>
                    <th>Year</th><th>Mileage</th><th>VIN</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vehicles}">
                    <td th:text="${v.name}"></td>
                    <td th:text="${v.make}"></td>
                    <td th:text="${v.model}"></td>
                    <td th:text="${v.year}"></td>
                    <td th:text="${v.mileage}"></td>
                    <td th:text="${v.vin}"></td>
                    <td>
                        <a th:href="@{/vehicles/{id}(id=${v.id})}"
                           class="btn btn-sm btn-outline-dark"><i class="bi bi-eye me-1"></i>View</a>
                        <a th:href="@{/vehicles/{id}/edit(id=${v.id})}"
                           class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil me-1"></i>Edit</a>
                        <form th:action="@{/vehicles/{id}/delete(id=${v.id})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('Delete this vehicle?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(vehicles)}">
                    <td colspan="7" class="text-center text-muted py-3">No vehicles found yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
