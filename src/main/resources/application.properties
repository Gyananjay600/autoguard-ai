# Local secrets can be supplied in an ignored .env file or as environment variables.
spring.config.import=optional:file:.env[.properties]

# Data source
spring.datasource.url=${AUTOGUARD_DB_URL:jdbc:mysql://localhost:3306/autoguard_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${AUTOGUARD_DB_USERNAME:root}
spring.datasource.password=${AUTOGUARD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Server
server.port=7070

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/Template/

# Spring AI / Groq (OpenAI-compatible)
spring.ai.openai.api-key=${AUTOGUARD_GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
app.ai.deep-model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=1000
