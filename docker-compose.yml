version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: autoguard_mysql
    restart: always
    environment:
      MYSQL_DATABASE: autoguard_db
      MYSQL_ROOT_PASSWORD: ${AUTOGUARD_DB_PASSWORD:-Gyana@1234qw}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  autoguard-app:
    build: .
    container_name: autoguard_app
    restart: always
    ports:
      - "7070:7070"
    depends_on:
      - mysqldb
    environment:
      AUTOGUARD_DB_URL: jdbc:mysql://mysqldb:3306/autoguard_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      AUTOGUARD_DB_USERNAME: root
      AUTOGUARD_DB_PASSWORD: ${AUTOGUARD_DB_PASSWORD:-Gyana@1234qw}
      AUTOGUARD_GROQ_API_KEY: ${AUTOGUARD_GROQ_API_KEY}

volumes:
  mysql_data:
